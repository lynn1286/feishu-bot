[package]
name = "feishu-bot"
version = "0.1.0"
edition = "2021"
description = "Sentry to Feishu alert forwarding service"
authors = ["Lynn"]
license = "MIT"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Random
rand = "0.9"

# Crypto
sha2 = "0.10"

# HTTP client
reqwest = { version = "0.13", features = ["json"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Crypto for signature verification
hmac = "0.12"
hex = "0.4"

# CLI
clap = { version = "4", features = ["derive"] }

# Configuration
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Embed frontend assets
rust-embed = "8"
mime_guess = "2"

# Open browser
open = "5"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async utilities
futures = "0.3"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Directories
dirs = "6"

[profile.release]
lto = true
strip = true
opt-level = "z"
